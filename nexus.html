  function migrateState(){
    const previousSchema=Number(state.schemaVersion)||0;
    state.settings={theme:'dark',company:'Nexo · Vida & Trabalho',weekHours:44,...(state.settings||{})};
    ['docs','checklists','automations','timeEntries','activity','risks','revisions','rfis','ncrs','releases','audit','trash','approvals','workOrders','fieldDiaries','inspections','costItems','changeOrders','notifications','contracts','measurements','transmittals','qualityActions','equipment','baselineHistory'].forEach(k=>state[k]=Array.isArray(state[k])?state[k]:[]);
    state.workspace={id:state.workspace?.id||uid('workspace'),name:state.workspace?.name||state.settings.company,mode:state.workspace?.mode||'private',access:state.workspace?.access||{},invites:state.workspace?.invites||[]};
    state.members.forEach(m=>m.accessRole=m.accessRole||(/coorden|gerente/i.test(m.role)?'Gerente':/wilson/i.test(m.name)?'Administrador':'Colaborador'));
    state.projects.forEach(p=>{p.workDays=p.workDays||[1,2,3,4,5];p.holidays=p.holidays||[];p.baselineBudget=Number(p.baselineBudget??p.budget??0)});
    state.tasks.forEach((t,i)=>{
      t.deps=Array.isArray(t.deps)?t.deps:[];t.links=Array.isArray(t.links)&&t.links.length?t.links:t.deps.map(taskId=>({taskId,type:t.depType||'FS',lag:Number(t.lagDays)||0}));
      t.parentId=t.parentId||'';t.order=Number(t.order??i);t.weight=Number(t.weight??Math.max(1,t.estimate||1));
      t.plannedCost=Number(t.plannedCost??t.cost??0);t.actualCost=Number(t.actualCost??(t.progress/100*t.plannedCost));
      t.raci={responsible:t.raci?.responsible||t.assignees?.[0]||'',accountable:t.raci?.accountable||project(t.projectId).manager||'',consulted:t.raci?.consulted||[],informed:t.raci?.informed||[]};
      t.baselineStart=t.baselineStart||t.start;t.baselineEnd=t.baselineEnd||t.end;t.subtasks=t.subtasks||[];t.comments=t.comments||[];t.attachments=t.attachments||[];t.tags=t.tags||[];t.assignees=t.assignees||[];t.customFields=t.customFields||{};
    });

  function automationText(a){if(a.trigger==='status')return`o status for “${a.condition}”, ${actionText(a)}`;if(a.trigger==='priority_status'){const [p,s]=a.condition.split('|');return`prioridade for “${p}” e status “${s}”, ${actionText(a)}`}return`a condição for atendida, ${actionText(a)}`}

  function moveToTrash(type,item){if(!item)return;pushUndo('mover item para lixeira');const labels={task:item.title,project:item.name,doc:item.title,risk:item.title,revisions:item.title,rfis:item.title,ncrs:item.title,releases:item.title},entry={id:uid('trash'),type,label:labels[type]||item.title||item.name||item.id,deletedAt:new Date().toISOString(),data:null};if(type==='project'){const pid=item.id,keys=['tasks','docs','checklists','timeEntries','risks','revisions','rfis','ncrs','releases'];entry.data={project:deepClone(item)};keys.forEach(k=>{entry.data[k]=state[k].filter(x=>x.projectId===pid);state[k]=state[k].filter(x=>x.projectId!==pid)});state.projects=state.projects.filter(x=>x.id!==pid);selectedProject='all'}else if(type==='task'){entry.data={task:deepClone(item),timeEntries:state.timeEntries.filter(e=>e.taskId===item.id)};state.tasks=state.tasks.filter(x=>x.id!==item.id);state.tasks.forEach(x=>{x.deps=(x.deps||[]).filter(id=>id!==item.id);x.links=taskLinks(x).filter(l=>l.taskId!==item.id);if(x.parentId===item.id)x.parentId=''});state.timeEntries=state.timeEntries.filter(e=>e.taskId!==item.id);if(state.activeTimer?.taskId===item.id)state.activeTimer=null}else{const key={doc:'docs',risk:'risks',revisions:'revisions',rfis:'rfis',ncrs:'ncrs',releases:'releases'}[type];if(!key)return;entry.data=deepClone(item);state[key]=state[key].filter(x=>x.id!==item.id)}state.trash.unshift(entry);activity(`<b>${esc(entry.label)}</b> foi movido para a lixeira.`,'×');queueSave();closeOverlay();renderView();toast('Item movido para a lixeira.')}
  function restoreTrash(id){const tr=byId(state.trash,id);if(!tr)return;pushUndo('restaurar item');if(tr.type==='project'){state.projects.push(tr.data.project);['tasks','docs','checklists','timeEntries','risks','revisions','rfis','ncrs','releases'].forEach(k=>state[k].push(...(tr.data[k]||[])))}else if(tr.type==='task'){state.tasks.push(tr.data.task);state.timeEntries.push(...(tr.data.timeEntries||[]))}else{const key={doc:'docs',risk:'risks',revisions:'revisions',rfis:'rfis',ncrs:'ncrs',releases:'releases'}[tr.type];if(key)state[key].push(tr.data)}state.trash=state.trash.filter(x=>x.id!==id);activity(`<b>${esc(tr.label)}</b> foi restaurado da lixeira.`,'↶');queueSave();renderAudit();toast('Item restaurado.')}

  function renderAudit(){const logs=state.audit.filter(a=>!searchTerm||`${a.action} ${a.user}`.toLowerCase().includes(searchTerm.toLowerCase())),rows=logs.slice(0,250).map(a=>`<div class="audit-row"><span>${fmtDateTime(a.at)}</span><span>${esc(a.user||'local')}</span><span class="audit-action">${esc(a.action)}</span><span>${a.icon||'•'}</span></div>`).join(''),trash=state.trash.map(t=>`<div class="trash-item"><strong>${esc(t.label)}</strong><small>${esc(t.type)} · excluído em ${fmtDateTime(t.deletedAt)}</small><div class="actions"><button class="btn sm" data-restore="${t.id}">Restaurar</button><button class="btn sm danger" data-purge="${t.id}">Excluir definitivamente</button></div></div>`).join('');$('#page').innerHTML=`<div class="page">${pageHead('Rastreabilidade','Auditoria e lixeira','Histórico de alterações, restauração e exportação para controle externo.',`<button class="btn" data-csv="audit">Exportar auditoria</button><button class="btn" data-csv="tasks">Exportar tarefas</button><button class="btn" data-csv="hours">Exportar horas</button>`)}<div class="grid audit-layout"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Log de auditoria</h2><div class="panel-sub">Até 500 eventos mantidos localmente</div></div></div><div class="panel-body" style="padding:0">${rows||empty('Sem eventos','As alterações futuras aparecerão aqui.')}</div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Lixeira</h2><div class="panel-sub">Itens podem ser restaurados</div></div></div><div class="panel-body">${trash||empty('Lixeira vazia','Exclusões recuperáveis aparecerão aqui.')}</div></section></div></div>`;$$('[data-restore]').forEach(b=>b.onclick=()=>restoreTrash(b.dataset.restore));$$('[data-purge]').forEach(b=>b.onclick=()=>confirmAction('Excluir definitivamente?','Essa ação não poderá ser desfeita.',()=>purgeTrash(b.dataset.purge)));$$('[data-csv]').forEach(b=>b.onclick=()=>exportCsv(b.dataset.csv))}
  function csvCell(v){return `"${String(v??'').replace(/"/g,'""')}"`}function exportCsv(type){let header=[],rows=[];if(type==='tasks'){header=['Projeto','Tarefa','Etapa','Status','Prioridade','Responsáveis','Início','Fim','Progresso','Planejado','Realizado'];rows=visibleTasks().map(t=>[project(t.projectId).code,t.title,t.phase,t.status,t.priority,t.assignees.map(id=>member(id).name).join(', '),t.start,t.end,t.progress,t.plannedCost,t.actualCost])}else if(type==='risks'){header=['Projeto','Risco','Categoria','Probabilidade','Impacto','Score','Status','Responsável','Prazo','Resposta'];rows=state.risks.filter(r=>selectedProject==='all'||r.projectId===selectedProject).map(r=>[project(r.projectId).code,r.title,r.category,r.probability,r.impact,riskScore(r),r.status,member(r.owner).name,r.due,r.response])}else if(type==='hours'){header=['Projeto','Tarefa','Pessoa','Início','Fim','Horas'];rows=state.timeEntries.filter(e=>selectedProject==='all'||e.projectId===selectedProject).map(e=>[project(e.projectId).code,byId(state.tasks,e.taskId)?.title||e.taskId,member(e.memberId).name,e.startedAt,e.endedAt,e.hours])}else if(type==='audit'){header=['Data','Usuário','Ação'];rows=state.audit.map(a=>[a.at,a.user,a.action])}else{header=['Projeto','Tarefa','Progresso','Custo planejado','Valor agregado','Custo realizado'];rows=earnedValue(selectedProject).tasks.map(t=>[project(t.projectId).code,t.title,t.progress,t.plannedCost,t.plannedCost*t.progress/100,t.actualCost])}const content='\ufeff'+[header,...rows].map(r=>r.map(csvCell).join(';')).join('\n'),blob=new Blob([content],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`PES_${type}_${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('CSV exportado.')}

  function openOperationModal(item){const edit=!!item,projectId=item?.projectId||(selectedProject==='all'?state.projects[0]?.id:selectedProject);let body;if(operationsTab==='orders'){const x=item||{code:`OS-${String(state.workOrders.length+1).padStart(4,'0')}`,title:'',area:'Fabricação',status:'Planejada',owner:state.members[0]?.id||'',due:addDays(today(),7),progress:0,notes:''};body=`<div class="form-grid"><div class="field"><label>Projeto</label><select class="select" id="opProject">${options(state.projects,projectId,p=>p.code+' — '+p.name)}</select></div><div class="field"><label>Código</label><input class="input" id="opCode" value="${esc(x.code)}"></div><div class="field span2"><label>Ordem de serviço</label><input class="input" id="opTitle" value="${esc(x.title)}"></div><div class="field"><label>Área</label><select class="select" id="opArea">${options(['Engenharia','Fabricação','Qualidade','Instalação'],x.area)}</select></div><div class="field"><label>Status</label><select class="select" id="opStatus">${options(['Planejada','Liberada','Em execução','Bloqueada','Concluída'],x.status)}</select></div><div class="field"><label>Responsável</label><select class="select" id="opOwner">${options(state.members,x.owner,m=>m.name)}</select></div><div class="field"><label>Prazo</label><input class="input" id="opDue" type="date" value="${x.due}"></div><div class="field"><label>Progresso (%)</label><input class="input" id="opProgress" type="number" min="0" max="100" value="${x.progress}"></div><div class="field span2"><label>Instruções</label><textarea class="textarea" id="opNotes">${esc(x.notes)}</textarea></div></div>`;openRecordModal(edit?'Editar ordem de serviço':'Nova ordem de serviço',body,()=>{const data={...x,id:edit?x.id:uid('os'),projectId:$('#opProject').value,code:$('#opCode').value.trim(),title:$('#opTitle').value.trim(),area:$('#opArea').value,status:$('#opStatus').value,owner:$('#opOwner').value,due:$('#opDue').value,progress:clamp(Number($('#opProgress').value   function openCostModal(){const pid=selectedProject==='all'?state.projects[0]?.id:selectedProject;overlay(modal('Novo item de custo',`<div class="form-grid"><div class="field"><label>Projeto</label><select class="select" id="costProject">${options(state.projects,pid,p=>p.code+' — '+p.name)}</select></div><div class="field"><label>Categoria</label><select class="select" id="costCategory">${options(['Materiais','Mão de obra','Equipamentos','Terceiros','Logística'],'Materiais')}</select></div><div class="field span2"><label>Descrição</label><input class="input" id="costDescription"></div><div class="field"><label>Fornecedor</label><input class="input" id="costSupplier"></div><div class="field"><label>Status</label><select class="select" id="costStatus">${options(['Planejado','Cotação','Contratado','Recebido','Pago'],'Cotação')}</select></div><div class="field"><label>Quantidade</label><input class="input" id="costQty" type="number" min="0" step="0.01" value="1"></div><div class="field"><label>Unidade</label><input class="input" id="costUnit" value="lote"></div><div class="field"><label>Valor unitário</label><input class="input" id="costValue" type="number" min="0" step="0.01"></div><div class="field"><label>Prazo</label><input class="input" id="costDue" type="date" value="${addDays(today(),7)}"></div></div>`,`<button class="btn" data-close>Cancelar</button><button class="btn primary" id="saveCost">Salvar item</button>`));bindModalClose();$('#saveCost').onclick=()=>{const description=$('#costDescription').value.trim();if(!description)return toast('Informe o item.','error');pushUndo('criar item de custo');state.costItems.push({id:uid('cost'),projectId:$('#costProject').value,category:$('#costCategory').value,description,supplier:$('#costSupplier').value.trim(),status:$('#costStatus').value,quantity:Number($('#costQty').value)||0,unit:$('#costUnit').value.trim(),unitCost:Number($('#costValue').value)||0,due:$('#costDue').value});activity(`Item de custo <b>${esc(descripti   function renderWorkspace(){const shared=state.workspace.mode==='shared',rows=state.members.map(m=>`<tr><td><div class="work-top">${avatar(m)}<div><b>${esc(m.name)}</b><div class="muted" style="font-size:8px">${esc(m.email||'')}</div></div></div></td><td>${esc(m.role)}</td><td><select class="select" data-access-role="${m.id}">${options(['Administrador','Gerente','Colaborador','Cliente','Somente leitura'],m.accessRole)}</select></td><td>${esc(m.sector||'—')}</td></tr>`).join(''),invites=(state.workspace.invites||[]).map(i=>`<div class="progress-row" style="grid-template-columns:1fr auto"><span>${esc(i.email)} · ${esc(i.role)}</span><span class="badge">Convite preparado</span></div>`).join('');$('#page').innerHTML=`<div class="page">${pageHead('Colaboração','Equipe e acessos','Papéis, permissões e preparação do espaço compartilhado em tempo real.',`<button class="btn" id="joinWorkspace">Entrar em um espaço</button><button class="btn primary" id="inviteUser">＋ Convidar usuário</button>`)}<div class="workspace-hero"><div class="eyebrow">ESPAÇO DE TRABALHO</div><h2 style="margin:0 0 7px">${esc(state.workspace.name)}</h2><p class="page-sub">${shared?'Modo compartilhado ativado. Usuários autorizados usam o mesmo banco do espaço.':'Modo privado: os dados permanecem vinculados à sua conta.'}</p><div class="actions" style="margin-top:14px"><span class="workspace-id">${esc(state.workspace.id)}</span><button class="btn ${shared?'danger':'good'}" id="toggleWorkspace">${shared?'Voltar ao modo privado':'Ativar modo compartilhado'}</button><button class="btn" id="copyWorkspaceId">Copiar identificação</button></div></div>${panel('Membros e permissões','Administrador controla; cliente e somente leitura têm acesso restrito.',`<div class="data-wrap"><table class="role-table"><thead><tr><th>Pessoa</th><th>Função</th><th>Acesso</th><th>Área</th></tr></thead><tbody>${rows}</tbody></table></div>`)}${invites?`<div style="height:14px"></div>${panel('Convites pendentes','Envie o acesso e sol   function openInviteModal(){overlay(modal('Convidar usuário',`<div class="field"><label>E-mail</label><input class="input" id="inviteEmail" type="email"></div><div class="field"><label>Nível de acesso</label><select class="select" id="inviteRole">${options(['Gerente','Colaborador','Cliente','Somente leitura'],'Colaborador')}</select></div><div class="field"><label>UID do Firebase (opcional inicialmente)</label><input class="input" id="inviteUid" placeholder="O usuário encontra após entrar no app"></div><p class="muted" style="font-size:9px">O app registra o convite. Para acesso seguro ao espaço compartilhado, adicione o UID autenticado às permissões antes de sincronizar.</p>`,`<button class="btn" data-close>Cancelar</button><button class="btn primary" id="saveInvite">Preparar convite</button>`,'sm'));bindModalClose();$('#saveInvite').onclick=()=>{const email=$('#inviteEmail').value.trim(),role=$('#inviteRole').value,uidValue=$('#inviteUid').value.trim();if(!email.includes('@'))return toast('Informe um e-mail válido.','error');state.workspace.invites.push({id:uid('invite'),email,role,uid:uidValue,at:new Date().toISOString()});if(uidValue)state.workspace.access[uidValue]=role;addNotification('Convite preparado',`${email} · ${role}`,'info','workspace');queueSave();closeOverlay();renderWorkspace();toast('Convite preparado.')}}

  function buildReport(){const d=reportData(),title=selectedProject==='all'?'Relatório consolidado do portfólio':project(selectedProject).name;return `<article class="report-paper" id="reportPaper"><div class="report-meta">PROJECT ENGINEERING SUITE · EMISSÃO ${new Date().toLocaleString('pt-BR')}</div><h1>${esc(title)}</h1><p>Relatório executivo de planejamento, execução e controle.</p><div class="report-kpis"><div class="report-kpi"><strong>${d.projects.length}</strong><span>Projetos</span></div><div class="report-kpi"><strong>${d.tasks.length}</strong><span>Tarefas</span></div><div class="report-kpi"><strong>${d.late.length}</strong><span>Atrasadas</span></div><div class="report-kpi"><strong>${d.hours.toFixed(1)}h</strong><span>Horas</span></div></div><h2>1. Situação dos projetos</h2><table><thead><tr><th>Código</th><th>Projeto</th><th>Cliente</th><th>Avanço</th><th>Prazo</th></tr></thead><tbody>${d.projects.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${projectProgress(p.id)}%</td><td>${fmtDate(p.end)}</td></tr>`).join('')}</tbody></table><h2>2. Tarefas críticas e atrasadas</h2>${d.late.length?`<table><thead><tr><th>Tarefa</th><th>Projeto</th><th>Responsável</th><th>Prazo</th></tr></thead><tbody>${d.late.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(project(t.projectId).code)}</td><td>${esc(t.assignees.map(id=>member(id).name).join(', '))}</td><td>${fmtDate(t.end)}</td></tr>`).join('')}</tbody></table>`:'<p>Não existem tarefas atrasadas no recorte selecionado.</p>'}<h2>3. Próximas entregas</h2><ul>${d.open.sort((a,b)=>a.end.localeCompare(b.end)).slice(0,10).map(t=>`<li><b>${esc(t.title)}</b> — ${fmtDate(t.end)} — ${esc(t.status)}</li>`).join('')}</ul><h2>4. Observações de controle</h2><p>Revisar dependências, capacidade dos responsáveis, pendências técnicas e liberações antes de assumir novas datas contratuais. Este relatório reflete os dados registrados no sistema na data de emissão.</p></article>`}
  function buildExecutiveReport(){const d=reportData(),ev=earnedValue(selectedProject),risks=state.risks.filter(r=>selectedProject==='all'||r.projectId===selectedProject).sort((a,b)=>riskScore(b)-riskScore(a)),critical=criticalPath(d.tasks),title=selectedProject==='all'?'Relatório consolidado do portfólio':project(selectedProject).name;return `<article class="report-paper" id="reportPaper"><div class="report-meta">PROJECT ENGINEERING SUITE V${APP_VERSION} · EMISSÃO ${new Date().toLocaleString('pt-BR')}</div><h1>${esc(title)}</h1><p>Relatório executivo integrado de escopo, prazo, custo, risco e governança.</p><div class="report-kpis"><div class="report-kpi"><strong>${d.projects.length}</strong><span>Projetos</span></div><div class="report-kpi"><strong>${d.late.length}</strong><span>Atrasadas</span></div><div class="report-kpi"><strong>${ev.CPI.toFixed(2)}</strong><span>CPI</span></div><div class="report-kpi"><strong>${ev.SPI.toFixed(2)}</strong><span>SPI</span></div></div><h2>1. Situação dos projetos</h2><table><thead><tr><th>Código</th><th>Projeto</th><th>Cliente</th><th>Avanço</th><th>Prazo</th><th>Orçamento</th></tr></thead><tbody>${d.projects.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${projectProgress(p.id)}%</td><td>${fmtDate(p.end)}</td><td>${money(p.budget)}</td></tr>`).join('')}</tbody></table><h2>2. Valor agregado</h2><table><thead><tr><th>BAC</th><th>PV</th><th>EV</th><th>AC</th><th>EAC</th><th>VAC</th></tr></thead><tbody><tr><td>${money(ev.BAC)}</td><td>${money(ev.PV)}</td><td>${money(ev.EV)}</td><td>${money(ev.AC)}</td><td>${money(ev.EAC)}</td><td>${money(ev.VAC)}</td></tr></tbody></table><h2>3. Prazo e caminho crítico</h2><table><thead><tr><th>Tarefa</th><th>Projeto</th><th>Status</th><th>Entrega</th><th>Condição</th></tr></thead><tbody>${d.tasks.filter(t=>critical.has(t.id)||t.end<today()||t.status==='Bloqueada').sort((a,b)=>a.end.localeCompare(b.end)).slice(0,15).map(t=>`<tr><td>${esc(t.title)}</td><td>${esc   function enterpriseRecordTable(arr,type){const names={contract:'Contratos',measurement:'Medições',transmittal:'Transmittals',quality:'Planos de ação',equipment:'Equipamentos'},rows=arr.map(x=>`<tr><td><b>${esc(x.code||x.name||'—')}</b></td><td>${esc(x.title||x.scope||x.description||x.type||'—')}</td><td>${esc(x.supplier||x.recipient||member(x.owner).name||'—')}</td><td>${x.value!=null?money(x.value):x.due?fmtDate(x.due):x.date?fmtDate(x.date):x.from?fmtDate(x.from)+' — '+fmtDate(x.to):'—'}</td><td><span class="badge">${esc(x.status||x.effectiveness||'Registrado')}</span></td><td><button class="btn sm" data-v6-edit="${x.id}" data-v6-type="${type}">Editar</button></td></tr>`).join('');return `<section class="panel data-wrap" style="margin-bottom:14px"><div class="panel-head"><h2 class="panel-title">${names[type]}</h2></div><table class="enterprise-table"><thead><tr><th>Código</th><th>Descrição</th><th>Parte / responsável</th><th>Valor / prazo</th><th>Status</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="6">Nenhum registro.</td></tr>`}</tbody></table></section>`}

  function captureBaseline(){const tasks=visibleTasks();if(!tasks.length)return toast('Nenhuma tarefa no recorte.','error');pushUndo('capturar linha de base');const snap={id:uid('baseline'),projectId:selectedProject,date:new Date().toISOString(),name:'Linha de base '+(state.baselineHistory.length+1),tasks:tasks.map(t=>({id:t.id,start:t.start,end:t.end,cost:t.plannedCost}))};state.baselineHistory.push(snap);tasks.forEach(t=>{t.baselineStart=t.start;t.baselineEnd=t.end});queueSave();renderCommandCenter();toast('Linha de base capturada.')}
  function autoReschedule(){const tasks=visibleTasks().filter(t=>t.status!=='Concluída').sort((a,b)=>a.start.localeCompare(b.start));if(!tasks.length)return;pushUndo('reprogramar cronograma');let changed=0;for(let pass=0;pass<tasks.length;pass++)for(const t of tasks){const dur=Math.max(0,diffDays(t.start,t.end)),links=taskLinks(t);let min=t.start;for(const l of links){const p=byId(state.tasks,l.taskId);if(!p)continue;let d=l.type==='SS'?addDays(p.start,l.lag||0):l.type==='FF'?addDays(p.end,(l.lag||0)-dur):l.type==='SF'?addDays(p.start,(l.lag||0)-dur):addDays(p.end,1+(l.lag||0));if(d>min)min=d}if(min>t.start){t.start=min;t.end=addDays(min,dur);changed++}}activity(`<b>${changed}</b> ajuste(s) aplicados pelo planejamento automático.`,'▰');queueSave();renderCommandCenter();toast(`${changed} ajuste(s) de cronograma aplicado(s).`)}

initFirebase=async function(){if(cloud.auth)return;if(NX.authPromise)return NX.authPromise;NX.authPromise=(async()=>{const v='12.18.0';await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);await Promise.all(['auth','database'].map(k=>loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-${k}-compat.js`)));cloud.app=firebase.apps.find(x=>x.name==='Nexo')||firebase.initializeApp(FIREBASE_CONFIG,'Nexo');cloud.auth=cloud.app.auth();cloud.db=cloud.app.database();await cloud.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);cloud.auth.onAuthStateChanged(async u=>{cloud.user=u;if(u&&NX.account!==u.uid)await nxAccount(u);else if(!u&&NX.account!=='local')await nxAccount(null)});})().catch(e=>{NX.authPromise=null;throw e});return NX.authPromise};

async function nxFlush(force=false){if(!NX.ready||NX.syncing||!NX.space?.cloud||!cloud.user||!NX.connection||!navigator.onLine||!nxCanEdit())return;const epoch=NX.epoch,spaceId=NX.space.id;NX.syncing=true;NX.error='';nxSyncStatus();try{for(const key of Object.keys(NX.pending)){if(epoch!==NX.epoch)break;if(NX.conflicts[key])continue;const p=deepClone(NX.pending[key]),ref=cloud.db.ref('nexoV1/spaces/'+spaceId+'/records/'+key);const result=await ref.transaction(current=>{if(current?.rev===p.op)return current;if((current?.rev||null)!==(p.baseRev||null))return;return {...p,rev:p.op,actor:NX.account,updatedAt:firebase.database.ServerValue.TIMESTAMP}},undefined,false);if(epoch!==NX.epoch)break;if(!result.committed){NX.conflicts[key]={local:deepClone(NX.pending[key]||p),remote:result.snapshot.val()};continue}NX.versions[key]=p.op;if(NX.pending[key]?.op===p.op)delete NX.pending[key];else if(NX.pending[key])NX.pending[key].baseRev=p.op;delete NX.conflicts[key];await nxStore()}if(epoch===NX.epoch)await nxFlushFiles(spaceId,epoch);if(epoch===NX.epoch){NX.lastSync=new Date().toISOString();await nxStore();if(force)toast(Object.keys(NX.conflicts).length?'Revise os conflitos antes de concluir a sincronização.':'Sincronização concluída.')}}catch(e){if(epoch===NX.epoch)nxCloudError(e)}finally{if(epoch===NX.epoch){NX.syncing=false;nxSyncStatus();}}}

function nxEditHealthProfile(){const p=nxProfile();nxForm('Seu perfil de saúde',[['age','Idade (anos)','number'],['height','Altura (cm)','number'],['weight','Peso informado (kg)','number'],['goal','Objetivo principal','select',['Bem-estar','Melhorar condicionamento','Ganhar força','Organizar alimentação','Gerenciar peso']],['diet','Padrão alimentar','select',['Onívora','Vegetariana','Vegana']],['allergies','Alergias / restrições (separadas por vírgula)','textarea'],['cookTime','Tempo de preparo disponível (min)','number'],['budget','Preferência de custo','select',['Econômico','Moderado']],['calorieTarget','Meta de energia definida com profissional (kcal)','number'],['sleepTarget','Meta pessoal de sono (h)','number'],['waterTarget','Meta pessoal de água (ml, opcional)','number'],['level','Experiência de treino','select',['Iniciante','Intermediário']],['equipment','Local / equipamentos','select',['Casa','Academia','Caminhada / corrida']],['days','Dias de treino por semana','number'],['minutes','Minutos por sessão','number'],['limitations','Dores / lesões / restrições ao exercício','textarea'],['clinical','Há condição clínica, gestação ou orientação específica a respeitar','checkbox'],['skin','Tipo de pele','select',['Mista','Oleosa','Seca','Sensível','Não sei']],['notes','Orientações do profissional / observações','textarea']],p,d=>{if(d.age!=null&&(d.age<18||d.age>110))throw Error('Os modelos automáticos deste app são para adultos. Registre planos profissionais manualmente para menores.');if(d.days<1||d.days>6||d.minutes<10||d.minutes>120)throw Error('Escolha de 1 a 6 dias e sessões de 10 a 120 minutos.');if(d.sleepTarget!=null&&(d.sleepTarget<4||d.sleepTarget>12))throw Error('Revise a meta de sono.');if(d.waterTarget!=null&&(d.waterTarget<0||d.waterTarget>6000))throw Error('Revise a meta de água com seu profissional.');if(d.weight!=null&&(d.weight<30||d.weight>350))throw Error('Revise o peso informado.');if(d.height!=null&&(d.height<100||d.height>240))throw Error('Revise a altura.');nxUpsert('healthProfiles',{...d,id:'profile'})})}
function nxEditHealthLog(log){const d=log||nxTodayHealth();nxForm('Registro de saúde',[['date','Data','date'],['weight','Peso (kg)','number'],['waist','Cintura (cm)','number'],['sleep','Sono (horas)','number'],['water','Água registrada (ml)','number'],['mood','Humor / energia 1–5','number'],['stress','Estresse percebido 1–5','number'],['systolic','Pressão sistólica (mmHg)','number'],['diastolic','Pressão diastólica (mmHg)','number'],['glucose','Glicemia (mg/dL, se medida)','number'],['notes','Contexto da medição / sintomas / observações','textarea']],d,v=>{if(!v.date)throw Error('Informe a data.');for(const k of ['sleep','water','weight','waist','systolic','diastolic','glucose'])if(v[k]!=null&&v[k]<0)throw Error('Revise os valores negativos.');for(const k of ['mood','stress'])if(v[k]!=null&&(v[k]<1||v[k]>5))throw Error('Use notas de 1 a 5.');if(v.sleep>24)throw Error('Sono não pode superar 24 horas no dia.');const same=state.healthLogs.find(l=>l.date===v.date&&l.id!==v.id);if(same)throw Error('Já existe um registro desta data. Edite-o no histórico.');nxUpsert('healthLogs',{...v,id:v.id||'day_'+v.date})},d.id?()=>nxDelete('healthLogs',d.id):null)}

function nxNormalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function nxAllergyCheck(profile){const aliases={'gluten':'gluten','celiaco':'gluten','celiaca':'gluten','leite':'leite','lactose':'leite','proteina do leite':'leite','ovo':'ovo','ovos':'ovo','amendoim':'amendoim','castanhas':'castanhas','nozes':'castanhas','soja':'soja','peixe':'peixe','frutos do mar':'peixe','aveia':'aveia','milho':'milho','lentilha':'lentilha','grao-de-bico':'grao-de-bico','grao de bico':'grao-de-bico'},words=nxNormalize(profile.allergies).split(/[,;\n]+/).map(w=>w.trim()).filter(Boolean),unknown=words.filter(w=>!aliases[w]&&!['nenhuma','nenhum','nao'].includes(w));return {tags:words.map(w=>aliases[w]).filter(Boolean),unknown}}
function nxMealCandidates(p,slot){const {tags}=nxAllergyCheck(p);return NX_RECIPES.filter(r=>r.slot===slot&&(p.diet==='Onívora'||(p.diet==='Vegetariana'?r.diet!=='Onívora':r.diet==='Vegana'))&&r.minutes<=Number(p.cookTime||25)&&(p.budget!=='Econômico'||r.cost==='Econômico')&&!r.allergens.some(a=>tags.includes(a))&&!(tags.includes('gluten')&&r.allergens.includes('aveia')))}
function nxFoodView(p){const plan=state.mealPlans.at(-1),food=state.foodLogs.filter(l=>l.date===today());return `<div class="notice">Sugestões de organização alimentar para adultos, baseadas em alimentos in natura ou minimamente processados. Porções, calorias e necessidades clínicas devem ser ajustadas com nutricionista. <a class="nx-link" href="${NX_HEALTH_SOURCES.food}" target="_blank" rel="noopener">Guia alimentar brasileiro</a>.</div><div class="nx-row nx-between nx-wrap" style="margin:20px 0"><div><strong>${plan?esc(plan.title):'Seu plano alimentar'}</strong><div class="nx-small nx-muted">${esc(p.diet)} · preparo até ${p.cookTime||25} min · ${esc(p.budget||'Econômico')}${p.calorieTarget?' · meta informada: '+p.calorieTarget+' kcal':''}</div></div><div class="actions">${nxButton(plan?'Gerar nova semana':'Montar minha semana','make-food','primary')}${plan?nxButton('Editar plano','edit-food-plan')+nxButton('Lista de compras','shopping'):''}</div></div>${plan?`<div class="panel data-wrap"><table class="data-table"><thead><tr><th>Dia</th><th>Café da manhã</th><th>Almoço</th><th>Lanche</th><th>Jantar</th></tr></thead><tbody>${(plan.days||[]).map(d=>`<tr><td><strong>${esc(d.day)}</strong></td>${['Café da manhã','Almoço','Lanche','Jantar'].map(slot=>`<td>${esc(d.meals?.[slot]?.name||'A definir')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="nx-card" style="margin-top:17px"><h3>Orientações e ajustes</h3><p style="white-space:pre-wrap">${esc(plan.notes||'Edite as refeições e porções de acordo com sua orientação nutricional.')}</p></div>`:`<section class="nx-card"><h3>Primeiro, seu perfil.</h3><p>Informe padrão alimentar, alergias e tempo de preparo. O plano será editável e incluirá uma lista de compras. O modelo não define déficit calórico nem substitui um plano clínico.</p>${nxButton('Preencher perfil','health-profile')}</section>`}<section class="nx-card" style="margin-top:24px"><div class="nx-row nx-between"><h3>Diário alimentar de hoje</h3>${nxB function nxGenerateMealPlan(){const p=nxProfile();if(!state.healthProfiles.length)return nxEditHealthProfile();const check=nxAllergyCheck(p);if(check.unknown.length)return toast('Restrição não reconhecida: '+check.unknown.join(', ')+'. Use um plano manual validado; o gerador não vai adivinhar substituições.','error');const slots=['Café da manhã','Almoço','Lanche','Jantar'],choices=slots.map(s=>nxMealCandidates(p,s));if(choices.some(x=>!x.length))return toast('Não há combinação para todas as refeições com estas restrições e tempo. Ajuste o perfil ou edite um plano manual.','error');const days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map((day,i)=>({day,meals:Object.fromEntries(slots.map((s,j)=>[s,deepClone(choices[j][i%choices[j].length])]))})),plan={id:uid('mealplan'),title:'Semana alimentar · '+fmtDate(today()),days,notes:'Ajuste quantidades à sua fome, rotina e orientação profissional. Use preparos simples e planeje o reaproveitamento seguro das refeições. Os tempos pressupõem grãos previamente cozidos quando necessário. Confira rótulos e risco de contaminação cruzada em caso de alergia.'+(p.clinical?' Você sinalizou uma condição clínica: revise este rascunho com nutricionista antes de segui-lo.':''),profileSnapshot:{diet:p.diet,allergies:p.allergies,cookTime:p.cookTime},createdAt:new Date().toISOString()};nxUpsert('mealPlans',plan);renderView();toast('Semana montada. Revise e personalize as refeições.')}

function nxDrawStrokes(ctx,strokes,w,h){ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){if(!s.points?.length)continue;ctx.strokeStyle=/^#[0-9a-f]{6}$/i.test(s.color)?s.color:'#17467a';ctx.fillStyle=ctx.strokeStyle;const pts=s.points;if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x*w,pts[0].y*h,s.width*w/900/2,0,Math.PI*2);ctx.fill();continue}for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];ctx.lineWidth=Math.max(.65,(s.width||3)*w/900*(.55+Number(b.p||.5)));ctx.beginPath();ctx.moveTo(a.x*w,a.y*h);ctx.lineTo(b.x*w,b.y*h);ctx.stroke()}}}

ossível exportar: '+e.message,'error')}});await paint()}catch(e){toast('Não foi possível abrir as anotações. Na primeira utilização, a ferramenta de PDF precisa de internet. '+e.message,'error')}}

addAttachment=async function(t,e){const f=e.target.files[0];if(!f)return;try{const file=await nxSaveFile(f);t.attachments=t.attachments||[];t.attachments.push({...file,nexo:true});queueSave();openTaskDetail(t.id);toast('Arquivo anexado.')}catch(e){toast(e.message,'error')}};
const nxLegacyDownload=downloadAttachment;downloadAttachment=async function(t,id){const f=t.attachments?.find(x=>x.id===id);if(f?.nexo){try{nxDownload(await nxReadFile(f.id),f.name)}catch(e){toast(e.message,'error')}}else nxLegacyDownload(t,id)};

function nxWorkspace(){const s=NX.space,roles={owner:'Proprietário',editor:'Pode editar',viewer:'Somente leitura'},people=s.people||{[s.owner]:{role:'owner',name:cloud.user?.displayName||'Eu',email:cloud.user?.email||''}};$('#page').innerHTML=`<div class="page">${nxPage('Espaços e equipes','Organize vida pessoal, família e trabalho com acessos independentes.',nxButton('Entrar por convite','join-space')+nxButton('Criar espaço','new-space','primary','plus'))}<div class="nx-grid3">${NX.spaces.map(sp=>`<article class="nx-card"><div class="nx-row nx-between"><span class="badge">${sp.kind==='personal'?'Pessoal privado':sp.kind==='family'?'Família':sp.kind==='demo'?'Demonstração':'Empresa / equipe'}</span>${sp.id===s.id?'<span class="badge">Atual</span>':''}</div><h3 style="margin-top:15px">${esc(sp.name)}</h3><p>${sp.cloud?'Sincronização Firebase':'Dados neste aparelho'}</p><button class="btn" data-space-open="${esc(sp.id)}">Abrir espaço</button></article>`).join('')}</div><section class="nx-card" style="margin-top:24px"><div class="nx-row nx-between nx-wrap"><div><h3>Acesso a ${esc(s.name)}</h3><p style="margin-bottom:0">${s.kind==='personal'?'Seu espaço pessoal é privado. Crie um espaço familiar ou profissional para compartilhar.':'Quem pode acessar os registros e arquivos deste espaço.'}</p></div>${s.kind!=='personal'&&s.kind!=='demo'?nxButton('Criar convite','invite-space','primary'):''}</div><div class="data-wrap" style="margin-top:20px"><table class="data-table"><thead><tr><th>Pessoa</th><th>Permissão</th><th></th></tr></thead><tbody>${Object.entries(people).map(([id,p])=>`<tr><td><strong>${esc(p.name||p.email||id)}</strong><div class="nx-small nx-muted">${esc(p.email||'')}</div></td><td>${nxOwner()&&id!==s.owner?`<select class="select" data-role-uid="${esc(id)}">${options(['editor','viewer'],p.role,x=>roles[x])}</select>`:roles[p.role]||'Sem acesso'}</td><td>${nxOwner()&&id!==s.owner?`<button class="btn sm danger" data-remove-uid="${esc(id)}">Remover</button>`:''}</td></tr>`).join('')}</tbody></table></div>${!s.cloud&&s.kind!=='demo'?`<div class="notice" style="margin-top:16px">Este espaço é local. ${cloud.user?'Ative a nuvem para sincronizar e compartilhar.':'Entre com Google para criar espaços compartilhados.'}</div><div class="actions" style="margin-top:14px">${cloud.user?nxButton('Ativar nuvem deste espaço','publish-space','primary'):nxButton('Entrar com Google','google','primary')}</div>`:''}<div style="margin-top:19px" class="nx-small nx-muted">Ao entrar com outra conta Google, o app troca também o conjunto de espaços. As contas não são mescladas automaticamente.</div></section><section class="nx-card" style="margin-top:22px"><h3>Como convidar alguém</h3><ol class="nx-small"><li>Crie um espaço de família ou empresa e ative a nuvem.</li><li>Crie um convite para o e-mail Google da pessoa, com permissão de edição ou leitura.</li><li>Copie o link ou código e envie pelo canal que preferir.</li><li>A pessoa entra com aquele Google e aceita o convite em “Entrar por convite”.</li></ol><p class="nx-small">A versão publicada precisa estar acessível à pessoa. O endereço privado de demonstração do ChatGPT não concede acesso aos seus convidados; use sua publicação no GitHub Pages ou Firebase Hosting.</p></section></div>`;nxSetAction('new-space',()=>nxForm('Criar espaço',[['name','Nome do espaço'],['kind','Tipo','select',[{id:'family',name:'Família'},{id:'company',name:'Empresa / equipe'}]]],{kind:'company'},d=>nxNewSpace(d.name,d.kind,!!cloud.user)));nxSetAction('join-space',()=>nxJoinInvite());nxSetAction('invite-space',nxInvite);nxSetAction('google',connectGoogle);nxSetAction('publish-space',nxPublishSpace);$$('[data-space-open]').forEach(b=>b.onclick=()=>nxSwitch(b.dataset.spaceOpen));$$('[data-role-uid]').forEach(b=>b.onchange=async()=>{try{await cloud.db.ref(`nexoV1/spaces/${s.id}/members/${b.dataset.roleUid}/role`).set(b.value);toast('Permissão atualizada.')}catch(e){nxCloudError(e)}});$$('[data-remove-uid]').forEach(b=>b.onclick=()=>confirmAction('Remover o acesso?','A pessoa perderá o acesso à nuvem deste espaço. Arquivos e dados que ela já baixou não podem ser apagados remotamente.',async()=>{try{await cloud.db.ref(`nexoV1/spaces/${s.id}/members/${b.dataset.removeUid}`).remove();renderView()}catch(e){nxCloudError(e)}}))}
async function nxPublishSpace(){if(!cloud.user)return connectGoogle();if(NX.space.kind==='demo')return toast('A demonstração não é enviada à nuvem.','error');const s=NX.space,existing=await cloud.db.ref('nexoV1/spaces/'+s.id+'/meta').once('value').catch(e=>{nxCloudError(e);return null});if(existing===null)return;try{if(!existing.exists()){await cloud.db.ref('nexoV1/spaces/'+s.id).set({meta:{name:s.name,kind:s.kind,owner:cloud.user.uid,createdAt:firebase.database.ServerValue.TIMESTAMP},members:{[cloud.user.uid]:{name:cloud.user.displayName||'',email:cloud.user.email||'',role:'owner'}}})}else if(existing.val().owner!==cloud.user.uid)throw Error('Este espaço pertence a outra conta.');s.cloud=true;s.owner=cloud.user.uid;s.roles={[cloud.user.uid]:'owner'};await cloud.db.ref(`nexoV1/users/${cloud.user.uid}/spaces/${s.id}`).set(true);await nxSaveSpaces();NX.baseline={};queueSave();await nxStartSync();renderView();toast('Nuvem ativada. Alterações adicionadas à fila.')}catch(e){nxCloudError(e)}}
function nxInvite(){if(!cloud.user||!NX.space.cloud)return toast('Ative a nuvem deste espaço antes de convidar.','error');if(!nxOwner())return toast('Somente o proprietário pode convidar.','error');if(NX.space.kind==='personal')return toast('O espaço pessoal é privado. Crie um espaço compartilhado.','error');nxForm('Criar convite',[['email','E-mail Google do convidado','email'],['role','Permissão','select',[{id:'editor',name:'Pode editar'},{id:'viewer',name:'Somente leitura'}]]],{role:'editor'},async d=>{if(!d.email.includes('@'))throw Error('Informe o e-mail.');const token='inv_'+crypto.getRandomValues(new Uint32Array(4)).join('_'),invite={spaceId:NX.space.id,email:d.email.toLowerCase(),role:d.role,owner:cloud.user.uid,spaceName:NX.space.name,expiresAt:Date.now()+7*86400000,createdAt:firebase.database.ServerValue.TIMESTAMP};await cloud.db.ref('nexoV1/invites/'+token).set(invite);setTimeout(()=>{const u=new URL(location.href);u.hash='invite='+token;overlay(modal('Convite criado',`<p>Destinatário: <strong>${esc(invite.email)}</strong></p><p>Válido por 7 dias. Somente a conta Google deste e-mail poderá aceitar.</p><label class="field"><span>Código</span><input class="input" id="nxInviteCode" readonly value="${token}"></label><p class="nx-small nx-muted">Envie o código e o endereço acessível do app. A criação do convite não envia e-mail automaticamente.</p>`,nxButton('Copiar link','copy-invite-link')+nxButton('Copiar código','copy-invite-code','primary')));bindModalClose();nxSetAction('copy-invite-link',()=>nxCopy(u.href));nxSetAction('copy-invite-code',()=>nxCopy(token))},0)})}
function nxJoinInvite(prefill=''){if(!cloud.user){localStorage.setItem('nexo_pending_invite',prefill||'');return connectGoogle()}nxForm('Entrar por convite',[['code','Cole o código ou link do convite']],{code:prefill||localStorage.getItem('nexo_pending_invite')||''},async d=>{let token=d.code;if(token.includes('#invite='))token=token.split('#invite=')[1].split('&')[0];if(!/^inv_[a-zA-Z0-9_]+$/.test(token))throw Error('Código de convite inválido.');const ref=cloud.db.ref('nexoV1/invites/'+token),snap=await ref.once('value'),invite=snap.val();if(!invite||invite.expiresAt<Date.now())throw Error('Convite expirado ou indisponível.');if(invite.email.toLowerCase()!==cloud.user.email?.toLowerCase())throw Error('Entre com o Google destinatário deste convite.');const sp=invite.spaceId;await cloud.db.ref(`nexoV1/spaces/${sp}/members/${cloud.user.uid}`).set({role:invite.role,email:cloud.user.email,name:cloud.user.displayName||'',invite:token});await cloud.db.ref(`nexoV1/users/${cloud.user.uid}/spaces/${sp}`).set(true);const [meta,members]=await Promise.all([cloud.db.ref(`nexoV1/spaces/${sp}/meta`).once('value'),cloud.db.ref(`nexoV1/spaces/${sp}/members`).once('value')]);const m=members.val(),s={id:sp,...meta.val(),roles:Object.fromEntries(Object.entries(m).map(([k,v])=>[k,v.role])),people:m,cloud:true};const existing=NX.spaces.find(x=>x.id===sp);if(existing)Object.assign(existing,s);else NX.spaces.push(s);await nxSaveSpaces();await nxSwitch(sp);localStorage.removeItem('nexo_pending_invite');toast('Você entrou no espaço '+s.name+'.')})}
function nxConflictDialog(){const entries=Object.entries(NX.conflicts);overlay(modal('Revisar conflitos',entries.length?`<p class="nx-muted">O mesmo registro foi alterado em dois lugares. Nenhuma versão foi apagada automaticamente.</p>${entries.map(([k,c],i)=>`<section class="nx-card" style="margin-bottom:16px"><h3>${esc(c.local.collection)} · ${esc(c.local.id)}</h3><div class="nx-grid2"><div><strong>Neste aparelho</strong><pre class="nx-code">${esc(c.local.deleted?'Excluído':JSON.stringify(JSON.parse(c.local.payload),null,2))}</pre></div><div><strong>Na nuvem</strong><pre class="nx-code">${esc(c.remote?.deleted?'Excluído':c.remote?.payload?JSON.stringify(JSON.parse(c.remote.payload),null,2):'Registro ausente')}</pre></div></div><div class="actions"><button class="btn" data-conflict="${i}" data-pick="remote">Usar a nuvem</button><button class="btn primary" data-conflict="${i}" data-pick="local">Enviar esta versão</button><button class="btn" data-conflict="${i}" data-pick="export">Baixar ambas</button></div></section>`).join('')}`:'<p>Nenhum conflito para revisar.</p>',`<button class="btn" data-close>Fechar</button>`));bindModalClose();$$('[data-conflict]').forEach(b=>b.onclick=async()=>{const [key,c]=entries[Number(b.dataset.conflict)];if(b.dataset.pick==='export')return nxJSON('Nexo_conflito.json',c);if(b.dataset.pick==='remote'){nxApplyRecord(c.remote||{...c.local,deleted:true});delete NX.pending[key]}else NX.pending[key]={...c.local,baseRev:c.remote?.rev||null,op:uid('op'),at:Date.now()};delete NX.conflicts[key];NX.baseline=nxPack(state);await nxStore();nxFlush();nxConflictDialog()})}
function nxSourceLinks(){return `<div class="nx-guide"><p>Referências usadas para escolher funções e fluxos, consultadas em setembro de 2026:</p><ul><li><a href="https://www.notion.com/releases/2022-12-15" target="_blank" rel="noopener">Notion</a>: subtarefas, dependências e visão de cronograma.</li><li><a href="https://clickup.com/features/goals" target="_blank" rel="noopener">ClickUp Goals</a>: metas mensuráveis ligadas ao trabalho.</li><li><a href="https://www.todoist.com/help/todoist/features/introduction-to-recurring-dates-YUYVJJAV" target="_blank" rel="noopener">Todoist</a>: tarefas recorrentes e acompanhamento do dia.</li><li><a href="https://support.myfitnesspal.com/hc/en-us/articles/15457546881805-What-is-included-in-the-free-version" target="_blank" rel="noopener">MyFitnessPal</a>: diário alimentar, exercícios e evolução.</li><li><a href="${NX_HEALTH_SOURCES.food}" target="_blank" rel="noopener">Ministério da Saúde</a>, <a href="${NX_HEALTH_SOURCES.exercise}" target="_blank" rel="noopener">OMS</a> e <a href="${NX_HEALTH_SOURCES.skin}" target="_blank" rel="noopener">AAD</a>: bases das sugestões de rotina.</li><li><a href="https://firebase.google.com/docs/database/web/offline-capabilities" target="_blank" rel="noopener">Firebase</a>: conexão e sincronização. A fila persistente do Nexo fica no IndexedDB.</li></ul><p>Os modelos e resumos do Nexo são processados localmente. Não existe IA generativa, conexão bancária ou integração com Apple Health nesta versão.</p></div>`}
function nxGuide(){return `<div class="nx-guide"><details open><summary>1. Ativar Google e autorizar os endereços</summary><ol><li>Abra <a href="https://console.firebase.google.com/project/agenda-6accc/authentication/providers" target="_blank" rel="noopener">Firebase → Authentication → Sign-in method</a> e ative Google.</li><li>Em Authentication → Settings → Authorized domains, adicione <strong>${esc(location.hostname||'seu domínio de publicação')}</strong> e o domínio onde você publicar, por exemplo <strong>wilsonf1996.github.io</strong>. Use apenas o hostname, sem caminho.</li><li>Qualquer conta Google pode se autenticar quando o provedor e a tela de consentimento permitem. Cada conta começa com espaço próprio. Se o OAuth estiver em modo de teste ou restrito à organização, libere os usuários no Google Cloud.</li><li>Abra o app por HTTPS em Safari, Chrome, Edge ou Firefox atuais. Login em arquivo file:// e em navegadores internos de outros apps pode ser bloqueado; use o navegador do dispositivo.</li></ol></details><details><summary>2. Publicar as regras do banco com segurança</summary><ol><li>Abra <a href="https://console.firebase.google.com/project/agenda-6accc/database/agenda-6accc-default-rtdb/rules" target="_blank" rel="noopener">Realtime Database → Rules</a>. Copie e guarde as regras atuais.</li><li>O Nexo usa somente o novo nó <code>nexoV1</code>. Preserve os nós dos apps antigos. Use “Combinar regras” abaixo para acrescentar as regras Nexo ao JSON atual.</li><li>Não pode existir permissão ampla de leitura/escrita na raiz: permissões herdadas podem ignorar as restrições do espaço. O combinador sinaliza esse caso para revisão.</li><li>Publique o resultado no console. Nenhuma senha ou chave administrativa é necessária no HTML. A configuração pública Firebase já foi reaproveitada dos seus arquivos.</li></ol><div class="actions">${nxButton('Baixar regras Nexo','download-rules')}${nxButton('Combinar com regras atuais','merge-rules')}</div><p>Arquivos novos ficam em blocos no Realtime Database com a mesma permissão do espaço, até 10 MB cada. Isso evita depender de uma lista de acesso separada no Storage. Considere uso e limites do seu plano Firebase para acervos grandes.</p></details><details><summary>3. Publicar o HTML e instalar no celular / iPad</summary><ol><li>Publique <code>index.html</code>, <code>sw.js</code>, <code>manifest.webmanifest</code> e os ícones na mesma pasta do seu GitHub Pages ou Firebase Hosting.</li><li>Abra online uma vez. Em iPhone/iPad: Safari → Compartilhar → Adicionar à Tela de Início. Em Android/desktop: menu do navegador → Instalar app, quando disponível.</li><li>O HTML contém todo o código de interface e funciona localmente. O pequeno <code>sw.js</code> é necessário para reabrir a versão web offline. Bibliotecas de PDF são baixadas na primeira utilização e guardadas em cache quando possível.</li><li>Para usar documentos offline, abra-os antes com internet. Alterações entram na fila e sincronizam ao reconectar com o app aberto. O sistema não promete sincronização enquanto o navegador está encerrado.</li><li>iOS e outros navegadores podem remover dados locais por falta de espaço. Mantenha sincronização e backups; não limpe os dados do navegador com itens pendentes.</li></ol></details><details><summary>4. Contas, família e empresa</summary><p>Em Espaços e equipes, crie quantos espaços precisar. O espaço pessoal não aceita convites. Família e empresa aceitam Proprietário, Editor e Leitor, com verificação nas regras do Firebase. Convites são vinculados a e-mail, expiram em 7 dias e precisam ser copiados e enviados por você.</p><p>Para trocar de Google, use “Trocar conta”. Os caches locais são separados por conta e espaço. Se outra pessoa usar o mesmo perfil de navegador no aparelho, poderá ter acesso aos dados locais já baixados; use perfis separados ou remova a cópia local da conta após exportar pendências.</p></details><details><summary>5. Trazer os dados dos apps anteriores</summary><p>Exporte JSON no LifeDocs e no Project Engineering Suite e importe aqui. Você pode mesclar com revisão de contagens. Há também uma opção de leitura dos dados antigos da conta Google atual. Os caminhos de origem são preservados e não são apagados.</p><p>Arquivos legados permanecem no Storage original até serem copiados para o Nexo. O importador preserva os metadados originais para consulta. O terceiro arquivo, WF Jarvis Supremo, não foi anexado; seus dados exigem o arquivo ou um backup compatível para migração.</p></details><details><summary>6. Limites desta versão</summary><p>Não há serviço de IA externa, reconhecimento de caligrafia, integração bancária/contábil/fiscal, Apple Health nem notificações push com o app fechado. Os planos são editáveis e gerados por regras locais. O módulo de saúde não faz diagnóstico ou prescrição clínica. A sincronização depende do Google e das regras publicadas pelo administrador Firebase.</p><p>Histórico, auditoria e aprovações são registros operacionais, sem assinatura digital qualificada. Colaboradores com edição podem alterar registros; use processos externos quando for necessária prova formal.</p></details></div>`}
function nxSettings(){const pending=Object.keys(NX.pending).length,conflicts=Object.keys(NX.conflicts).length;$('#page').innerHTML=`<div class="page">${nxPage('Configurações','Conta, sincronização, preferências e ativação do app.') }<div class="nx-grid2"><section class="nx-card"><h3>Minha conta</h3><p>${cloud.user?`<strong>${esc(cloud.user.displayName||'Conta Google')}</strong><br>${esc(cloud.user.email)}`:'Você está usando este aparelho sem login.'}</p><div class="actions">${cloud.user?nxButton('Trocar conta','google')+nxButton('Sair','signout'):nxButton('Entrar com Google','google','primary')}</div>${cloud.user?`<p class="nx-small nx-muted">UID: ${esc(cloud.user.uid)}</p>`:''}</section><section class="nx-card"><h3>Sincronização</h3><p><strong id="nxSyncDetail"></strong></p>${NX.error?`<div class="notice">${esc(NX.error)}</div>`:''}<div class="nx-statline"><span>Registros na fila</span><strong>${pending}</strong></div><div class="nx-statline"><span>Arquivos na fila</span><strong>${NX.filesPending.length}</strong></div><div class="nx-statline"><span>Última sincronização</span><strong>${NX.lastSync?fmtDateTime(NX.lastSync):'Ainda não realizada'}</strong></div><div class="actions" style="margin-top:15px">${nxButton('Sincronizar agora','sync','primary')}${nxButton('Revisar conflitos ('+conflicts+')','conflicts')}${!NX.space.cloud&&cloud.user?nxButton('Ativar nuvem','publish-space'):''}</div></section><section class="nx-card"><h3>Backup e importação</h3><p>Exporte dados e arquivos disponíveis. Na importação, os registros existentes ficam preservados, com conflitos revisáveis.</p><div class="actions nx-wrap">${nxButton('Backup completo JSON','backup','primary')}<label class="btn">Importar JSON<input type="file" id="nxImportFile" accept="application/json,.json" hidden></label>${nxButton('Dados dos apps anteriores','legacy-cloud')}</div><p class="nx-small nx-muted">O backup informa arquivos que não estavam disponíveis offline. Baixe esses arquivos antes de apagar qualquer origem.</p></section><section class="nx-card"><h3>Aparência e uso offline</h3><label class="nx-row">Tema <select id="nxTheme" class="select">${options(['light','dark'],state.settings.theme,x=>x==='light'?'Claro':'Escuro')}</select></label><div class="nx-statline"><span>Cache para reabrir offline</span><strong>${navigator.serviceWorker?.controller?'Ativo':location.protocol==='file:'?'HTML local':'Aguardando sw.js'}</strong></div><div class="actions" style="margin-top:14px">${nxButton('Pedir armazenamento persistente','persist-storage')}${nxButton('Demonstração','demo')}</div></section></div><section class="nx-card" style="margin-top:23px"><h3>Ativação: Google, Firebase e outras contas</h3>${nxGuide()}</section><section class="nx-card" style="margin-top:23px"><h3>Referências e pesquisa de funções</h3>${nxSourceLinks()}</section><section class="nx-card" style="margin-top:23px"><h3>Controle dos seus dados</h3><div class="actions">${nxButton('Abrir histórico e lixeira','audit')}${nxButton('Remover cópia local desta conta','clear-cache','danger')}</div><p class="nx-small nx-muted">Esta opção apaga apenas os dados desta conta neste aparelho. Os registros da nuvem permanecem.</p></section></div>`;nxSetAction('google',connectGoogle);nxSetAction('signout',disconnectCloud);nxSetAction('sync',()=>nxFlush(true));nxSetAction('conflicts',nxConflictDialog);nxSetAction('publish-space',nxPublishSpace);nxSetAction('backup',nxExport);$('#nxImportFile').onchange=nxImportFile;nxSetAction('legacy-cloud',nxLegacyCloud);nxSetAction('download-rules',()=>nxJSON('nexo-firebase-rules.json',NX_RULES));nxSetAction('merge-rules',nxMergeRules);nxSetAction('demo',nxDemo);nxSetAction('audit',()=>navigate('audit'));nxSetAction('clear-cache',nxClearCache);nxSetAction('persist-storage',async()=>{const yes=await navigator.storage?.persist?.();toast(yes?'Armazenamento persistente concedido.':'O navegador não concedeu persistência. Continue mantendo backups.')});$('#nxTheme').onchange=e=>{state.settings.th
