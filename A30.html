  const safeHttpUrl=v=>{try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};

    async set(k,v){return new Promise((res,rej)=>{const q=this.db.transaction('data','readwrite').objectStore('data').put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
  };

  function migrateState(){
    const previousSchema=Number(state.schemaVersion)||0;
    state.settings={theme:'dark',company:'Project Engineering Suite',weekHours:44,...(state.settings||{})};

  function moveToTrash(type,item){if(!item)return;pushUndo('mover item para lixeira');const labels={task:item.title,project:item.name,doc:item.title,risk:item.title,revisions:item.title,rfis:item.title,ncrs:item.title,releases:item.title},entry={id:uid('trash'),type,label:labels[type]||item.title||item.name||item.id,deletedAt:new Date().toISOString(),data:null};if(type==='project'){const pid=item.id,keys=['tasks','docs','checklists','timeEntries','risks','revisions','rfis','ncrs','releases'];entry.data={project:deepClone(item)};keys.forEach(k=>{entry.data[k]=state[k].filter(x=>x.projectId===pid);state[k]=state[k].filter(x=>x.projectId!==pid)});state.projects=state.projects.filter(x=>x.id!==pid);selectedProject='all'}else if(type==='task'){entry.data={task:deepClone(item),timeEntries:state.timeEntries.filter(e=>e.taskId===item.id)};state.tasks=state.tasks.filter(x=>x.id!==item.id);state.tasks.forEach(x=>{x.deps=(x.deps||[]).filter(id=>id!==item.id);x.links=taskLinks(x).filter(l=>l.taskId!==item.id);if(x.parentId===item.id)x.parentId=''});state.timeEntries=state.timeEntries.filter(e=>e.taskId!==item.id);if(state.activeTimer?.taskId===item.id)state.activeTimer=null}else{const key={doc:'docs',risk:'risks',revisions:'revisions',rfis:'rfis',ncrs:'ncrs',releases:'releases'}[type];if(!key)return;entry.data=deepClone(item);state[key]=state[key].filter(x=>x.id!==item.id)}state.trash.unshift(entry);activity(`<b>${esc(entry.label)}</b> foi movido para a lixeira.`,'×');queueSave();closeOverlay();renderView();toast('Item movido para a lixeira.')}

  function csvCell(v){return `"${String(v??'').replace(/"/g,'""')}"`}function exportCsv(type){let header=[],rows=[];if(type==='tasks'){header=['Projeto','Tarefa','Etapa','Status','Prioridade','Responsáveis','Início','Fim','Progresso','Planejado','Realizado'];rows=visibleTasks().map(t=>[project(t.projectId).code,t.title,t.phase,t.status,t.priority,t.assignees.map(id=>member(id).name).join(', '),t.start,t.end,t.progress,t.plannedCost,t.actualCost])}else if(type==='risks'){header=['Projeto','Risco','Categoria','Probabilidade','Impacto','Score','Status','Responsável','Prazo','Resposta'];rows=state.risks.filter(r=>selectedProject==='all'||r.projectId===selectedProject).map(r=>[project(r.projectId).code,r.title,r.category,r.probability,r.impact,riskScore(r),r.status,member(r.owner).name,r.due,r.response])}else if(type==='hours'){header=['Projeto','Tarefa','Pessoa','Início','Fim','Horas'];rows=state.timeEntries.filter(e=>selectedProject==='all'||e.projectId===selectedProject).map(e=>[project(e.projectId).code,byId(state.tasks,e.taskId)?.title||e.taskId,member(e.memberId).name,e.startedAt,e.endedAt,e.hours])}else if(type==='audit'){header=['Data','Usuário','Ação'];rows=state.audit.map(a=>[a.at,a.user,a.action])}else{header=['Projeto','Tarefa','Progresso','Custo planejado','Valor agregado','Custo realizado'];rows=earnedValue(selectedProject).tasks.map(t=>[project(t.projectId).code,t.title,t.progress,t.plannedCost,t.plannedCost*t.progress/100,t.actualCost])}const content='\ufeff'+[header,...rows].map(r=>r.map(csvCell).join(';')).join('\n'),blob=new Blob([content],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`PES_${type}_${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('CSV exportado.')}

  function buildReport(){const d=reportData(),title=selectedProject==='all'?'Relatório consolidado do portfólio':project(selectedProject).name;return `<article class="report-paper" id="reportPaper"><div class="report-meta">PROJECT ENGINEERING SUITE · EMISSÃO ${new Date().toLocaleString('pt-BR')}</div><h1>${esc(title)}</h1><p>Relatório executivo de planejamento, execução e controle.</p><div class="report-kpis"><div class="report-kpi"><strong>${d.projects.length}</strong><span>Projetos</span></div><div class="report-kpi"><strong>${d.tasks.length}</strong><span>Tarefas</span></div><div class="report-kpi"><strong>${d.late.length}</strong><span>Atrasadas</span></div><div class="report-kpi"><strong>${d.hours.toFixed(1)}h</strong><span>Horas</span></div></div><h2>1. Situação dos projetos</h2><table><thead><tr><th>Código</th><th>Projeto</th><th>Cliente</th><th>Avanço</th><th>Prazo</th></tr></thead><tbody>${d.projects.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${projectProgress(p.id)}%</td><td>${fmtDate(p.end)}</td></tr>`).join('')}</tbody></table><h2>2. Tarefas críticas e atrasadas</h2>${d.late.length?`<table><thead><tr><th>Tarefa</th><th>Projeto</th><th>Responsável</th><th>Prazo</th></tr></thead><tbody>${d.late.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(project(t.projectId).code)}</td><td>${esc(t.assignees.map(id=>member(id).name).join(', '))}</td><td>${fmtDate(t.end)}</td></tr>`).join('')}</tbody></table>`:'<p>Não existem tarefas atrasadas no recorte selecionado.</p>'}<h2>3. Próximas entregas</h2><ul>${d.open.sort((a,b)=>a.end.localeCompare(b.end)).slice(0,10).map(t=>`<li><b>${esc(t.title)}</b> — ${fmtDate(t.end)} — ${esc(t.status)}</li>`).join('')}</ul><h2>4. Observações de controle</h2><p>Revisar dependências, capacidade dos responsáveis, pendências técnicas e liberações antes de assumir novas datas contratuais. Este relatório reflete os dados registrados no sistema na data de emissão.</p></article>`}
  function buildExecutiveReport(){const d=reportData(),ev=earnedValue(selectedProject),risks=state.risks.filter(r=>selectedProject==='all'||r.projectId===selectedProject).sort((a,b)=>riskScore(b)-riskScore(a)),critical=criticalPath(d.tasks),title=selectedProject==='all'?'Relatório consolidado do portfólio':project(selectedProject).name;return `<article class="report-paper" id="reportPaper"><div class="report-meta">PROJECT ENGINEERING SUITE V${APP_VERSION} · EMISSÃO ${new Date().toLocaleString('pt-BR')}</div><h1>${esc(title)}</h1><p>Relatório executivo integrado de escopo, prazo, custo, risco e governança.</p><div class="report-kpis"><div class="report-kpi"><strong>${d.projects.length}</strong><span>Projetos</span></div><div class="report-kpi"><strong>${d.late.length}</strong><span>Atrasadas</span></div><div class="report-kpi"><strong>${ev.CPI.toFixed(2)}</strong><span>CPI</span></div><div class="report-kpi"><strong>${ev.SPI.toFixed(2)}</strong><span>SPI</span></div></div><h2>1. Situação dos projetos</h2><table><thead><tr><th>Código</th><th>Projeto</th><th>Cliente</th><th>Avanço</th><th>Prazo</th><th>Orçamento</th></tr></thead><tbody>${d.projects.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${projectProgress(p.id)}%</td><td>${fmtDate(p.end)}</td><td>${money(p.budget)}</td></tr>`).join('')}</tbody></table><h2>2. Valor agregado</h2><table><thead><tr><th>BAC</th><th>PV</th><th>EV</th><th>AC</th><th>EAC</th><th>VAC</th></tr></thead><tbody><tr><td>${money(ev.BAC)}</td><td>${money(ev.PV)}</td><td>${money(ev.EV)}</td><td>${money(ev.AC)}</td><td>${money(ev.EAC)}</td><td>${money(ev.VAC)}</td></tr></tbody></table><h2>3. Prazo e caminho crítico</h2><table><thead><tr><th>Tarefa</th><th>Projeto</th><th>Status</th><th>Entrega</th><th>Condição</th></tr></thead><tbody>${d.tasks.filter(t=>critical.has(t.id)||t.end<today()||t.status==='Bloqueada').sort((a,b)=>a.end.localeCompare(b.end)).slice(0,15).map(t=>`<tr><td>${esc(t.title)}</td><td>${esc   function saveTaskForm(original,isEdit){
    const title=$('#fTaskTitle').value.trim(),start=$('#fTaskStart').value,end=$('#fTaskEnd').value;if(!title)return toast('Informe o título da tarefa.','error');if(!start||!end||end<start)return toast('Confira as datas da tarefa.','error');
    const old={...original},data={...original,id:isEdit?original.id:uid('task'),projectId:$('#fTaskProject').value,title,phase:$('#fTaskPhase').value.trim()||'Geral',description:$('#fTaskDesc').value.trim(),status:$('#fTaskStatus').value,priority:$('#fTaskPriority').value,assignees:$$('input[name="assignee"]:checked').map(i=>i.value),start,end,estimate:Number($('#fTaskEstimate').value)||0,progress:Number($('#fTaskProgress').value)||0,deps:$$('#fTaskDeps option:checked').map(o=>o.value),milestone:$('#fTaskMilestone').checked,tags:$('#fTaskTags').value.split(',').map(s=>s.trim()).filter(Boolean),subtasks:original.subtasks||[],comments:original.comments||[],attachments:original.attachments||[],createdAt:original.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};

  function createsCycle(taskId,deps){if(!taskId)return false;const map=new Map(state.tasks.map(t=>[t.id,t.deps||[]]));map.set(taskId,deps);const visit=(id,seen=new Set())=>{if(id===taskId&&seen.size)return true;if(seen.has(id))return false;seen.add(id);return (map.get(id)||[]).some(d=>visit(d,new Set(seen)))};return deps.some(d=>visit(d,new Set()))}

  function renderAttachments(t){const files=t.attachments||[];return files.length?`<div class="attachment-grid">${files.map(a=>{const data=String(a.data||''),image=String(a.type||'').startsWith('image/'),src=/^data:image\/(png|jpeg|webp|gif);base64,/i.test(data)?data:image?safeHttpUrl(data):'',preview=src?`<img class="attachment-thumb" src="${esc(src)}" alt="">`:'<span class="attachment-thumb" style="display:grid;place-items:center">▣</span>';return `<button class="btn sm attachment-item" data-attachment="${a.id}" title="Abrir ${esc(a.name)}">${preview}<span class="attachment-copy">${esc(a.name)}<small class="muted" style="display:block">${Math.ceil(a.size/1024)} KB${a.remote?' · nuvem':''}</small></span></button>`}).join('')}</div>`:'<span class="muted" style="font-size:9px">Nenhum arquivo anexado.</span>'}
  async function addAttachment(t,e){const f=e.target.files[0];if(!f)return;if(f.size<=1048576){const reader=new FileReader();reader.onload=()=>{t.attachments=t.attachments||[];t.attachments.push({id:uid('file'),name:f.name,type:f.type,size:f.size,data:reader.result});queueSave();openTaskDetail(t.id);toast('Arquivo anexado.')};reader.readAsDataURL(f);return}if(!cloud.user||!cloud.storage)return toast('Arquivos acima de 1 MB exigem conexão com a nuvem.','error');try{toast('Enviando arquivo para a nuvem…');const path=`projectEngineeringSuite/${cloud.user.uid}/${t.projectId}/${Date.now()}_${slug(f.name).slice(0,90)}`,ref=cloud.storage.ref(path);await ref.put(f,{contentType:f.type});const url=await ref.getDownloadURL();t.attachments=t.attachments||[];t.attachments.push({id:uid('file'),name:f.name,type:f.type,size:f.size,data:url,remote:true,path});addNotification('Arquivo em nuvem',`${f.name} foi anexado a ${t.title}.`,'success','tasks');queueSave();openTaskDetail(t.id);toast('Arquivo enviado e anexado.')}catch(err){toast('Falha no envio. Verifique as regras do Firebase Storage.','error')}}
  function downloadAttachment(t,id){const a=byId(t.attachments,id),data=String(a?.data||''),remote=safeHttpUrl(data);if(remote){window.open(remote,'_blank','noopener');return}if(!a||!/^data:[^;,]{1,100}(?:;charset=[^;,]{1,40})?;base64,/i.test(data))return toast('Arquivo inválido ou corrompido.','error');const link=document.createElement('a');link.href=data;link.download=a.name;link.click()}

  function openSketchPad(t){
    overlay(modal('Rascunho técnico',`<div class="sketch-tools"><button class="sketch-color active" style="--ink:#172033" data-ink="#172033" aria-label="Caneta preta"></button><button class="sketch-color" style="--ink:#e11d3f" data-ink="#e11d3f" aria-label="Caneta vermelha"></button><button class="sketch-color" style="--ink:#2563eb" data-ink="#2563eb" aria-label="Caneta azul"></button><button class="btn" id="sketchEraser">⌫ Borracha</button><label class="field-inline">Espessura <input id="sketchWidth" type="range" min="1" max="18" value="4"><strong id="sketchWidthValue">4 px</strong></label><button class="btn" id="sketchGrid"># Grade</button><button class="btn" id="sketchUndo">↶ Desfazer traço</button><button class="btn danger" id="sketchClear">Limpar</button><span class="badge" id="pointerMode">Dedo, mouse ou caneta</span></div><div class="sketch-canvas-wrap" id="sketchWrap"><canvas class="sketch-canvas" id="sketchCanvas" aria-label="Área de desenho técnico"></canvas><span class="sketch-hint">Pressão da caneta compatível · rejeição de palma durante o traço</span></div>`,`<button class="btn" data-close>Cancelar</button><button class="btn" id="downloadSketch">Baixar PNG</button><button class="btn primary" id="saveSketch">Salvar na tarefa</button>`,'sketch-modal'));
    bindModalClose();const canvas=$('#sketchCanvas'),wrap=$('#sketchWrap'),ctx=canvas.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),rect=wrap.getBoundingClientRect(),cssW=Math.max(300,Math.round(rect.width)),cssH=Math.max(300,Math.round(rect.height));canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);let strokes=[],ink='#172033',width=4,eraser=false,grid=true,activePointer=null,current=null;
    const base=()=>{ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,cssW,cssH);if(grid){ctx.strokeStyle='#dce3eb';ctx.lineWidth=.65;ctx.beginPath();for(let x=20;x<cssW;x+=20){ctx.moveTo(x,0);ctx.lineTo(x,cssH)}for(let y=20;y<cssH;y+=20){ctx.moveTo(0,y);ctx.lineTo(cssW,y)}ctx.stroke();ctx.strokeStyle='#bac6d4';ctx.lineWidth=.8;ctx.beginPath();for(let x=100;x<cssW;x+=100){ctx.moveTo(x,0);ctx.lineTo(x,cssH)}for(let y=100;y<cssH;y+=100){ctx.moveTo(0,y);ctx.lineTo(cssW,y)}ctx.stroke()}ctx.restore()};
    const segment=(stroke,a,b)=>{const pressure=stroke.erase?1:Math.max(.35,((a.p||.5)+(b.p||.5))/2);ctx.save();ctx.globalCompositeOperation='source-over';ctx.strokeStyle=stroke.erase?'#fff':stroke.color;ctx.lineWidth=stroke.erase?Math.max(20,stroke.width*4):stroke.width*(.7+pressure*.65);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()};
    const redraw=()=>{base();strokes.forEach(s=>{if(s.points.length===1)segment(s,s.points[0],{...s.points[0],x:s.points[0].x+.01});else for(let i=1;i<s.points.length;i++)segment(s,s.points[i-1],s.points[i])})};
    const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*cssW/r.width,y:(e.clientY-r.top)*cssH/r.height,p:e.pressure||.5}};
    base();canvas.onpointerdown=e=>{if(e.button!==0||activePointer!==null)return;e.preventDefault();activePointer=e.pointerId;canvas.setPointerCapture(e.pointerId);current={color:ink,width,erase:eraser,points:[point(e)]};strokes.push(current);$('#pointerMode').textContent=e.pointerType==='pen'?'Caneta ativa · pressão detectada':e.pointerType==='touch'?'Desenho com o dedo':'Desenho com mouse';segment(current,current.points[0],{...current.points[0],x:current.points[0].x+.01})};canvas.onpointermove=e=>{if(e.pointerId!==activePointer||!current)return;e.preventDefault();const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];events.forEach(ev=>{const p=point(ev),last=current.points.at(-1);current.points.push(p);segment(current,last,p)})};const end=e=>{if(e.pointerId!==activePointer)return;try{canvas.releasePointerCapture(e.pointerId)}catch{}activePointer=null;current=null};canvas.onpointerup=end;canvas.onpointercancel=end;canvas.oncontextmenu=e=>e.preventDefault();
    $$('[data-ink]').forEach(b=>b.onclick=()=>{ink=b.dataset.ink;eraser=false;$$('[data-ink]').forEach(x=>x.classList.toggle('active',x===b));$('#sketchEraser').classList.remove('primary')});$('#sketchEraser').onclick=()=>{eraser=true;$$('[data-ink]').forEach(x=>x.classList.remove('active'));$('#sketchEraser').classList.add('primary')};$('#sketchWidth').oninput=e=>{width=Number(e.target.value);$('#sketchWidthValue').textContent=width+' px'};$('#sketchGrid').onclick=e=>{grid=!grid;e.currentTarget.classList.toggle('primary',grid);redraw()};$('#sketchGrid').classList.add('primary');$('#sketchUndo').onclick=()=>{strokes.pop();redraw()};$('#sketchClear').onclick=()=>{if(!strokes.length||confirm('Limpar todos os traços deste rascunho?')){strokes=[];redraw()}};
    const png=()=>{const out=document.createElement('canvas'),scale=Math.min(1,1400/canvas.width,900/canvas.height);out.width=Math.max(1,Math.round(canvas.width*scale));out.height=Math.max(1,Math.round(canvas.height*scale));const outCtx=out.getContext('2d');outCtx.fillStyle='#fff';outCtx.fillRect(0,0,out.width,out.height);outCtx.drawImage(canvas,0,0,out.width,out.height);return out.toDataURL('image/png')},fileName=()=>`Rascunho_${slug(t.title).slice(0,60)}_${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.png`;$('#downloadSketch').onclick=()=>{const link=document.createElement('a');link.href=png();link.download=fileName();link.click()};$('#saveSketch').onclick=()=>{if(!strokes.length)return toast('Faça ao menos um traço antes de salvar.','error');const data=png(),size=Math.ceil((data.length-data.indexOf(',')-1)*.75);if(size>2097152)return toast('Rascunho muito grande. Apague alguns traços ou baixe o PNG.','error');pushUndo('anexar rascunho técnico');t.attachments=t.attachments||[];t.attachments.push({id:uid('sketch'),name:fileName(),type:'image/png',size,data});activity(`Rascunho técnico anexado a <b>${esc(t.title)}</b>.`,'✎');queueSave();closeOverlay();openTaskDetail(t.id);toast('Rascunho salvo na tarefa.')};
  }

  function openTaskDetail(id){
    const t=byId(state.tasks,id);if(!t)return;const p=project(t.projectId),hours=sum(state.timeEntries.filter(e=>e.taskId===t.id),e=>e.hours),links=taskLinks(t),cpm=cpmSchedule(state.tasks.filter(x=>x.projectId===t.projectId)).calc.get(t.id)||{},custom=Object.entries(t.customFields||{}).map(([k,v])=>`<div class="detail-box"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join(''),externalUrl=safeHttpUrl(t.link);
    overlay(`<div class="drawer-backdrop" data-close-overlay></div><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><div><div class="eyebrow">${esc(p.code)} · ${esc(t.phase)}</div><div class="drawer-title">${esc(t.title)}</div></div><div class="actions"><button class="btn sm" id="editFromDetail">Editar</button><button class="close" data-close>×</button></div></div><div class="drawer-body"><div class="actions" style="margin-bottom:14px"><button class="btn ${state.activeTimer?.taskId===t.id?'danger':'good'}" id="taskTimer">${state.activeTimer?.taskId===t.id?'■ Parar cronômetro':'▶ Iniciar cronômetro'}</button><button class="btn" id="quickComplete">${t.status==='Concluída'?'Reabrir tarefa':'✓ Concluir tarefa'}</button><button class="btn" id="taskAssistant">✦ Assistente</button><button class="btn" id="taskLinks">⌘ Vínculos</button><button class="btn" id="taskSketch">✎ Rascunho técnico</button></div><div class="detail-grid"><div class="detail-box"><small>Status</small><strong class="${statusClass(t.status)}">${esc(t.status)}</strong></div><div class="detail-box"><small>Prioridade</small><strong class="${priorityClass(t.priority)}">${esc(t.priority)}</strong></div><div class="detail-box"><small>Período</small><strong>${fmtDate(t.start)} — ${fmtDate(t.end)}</strong></div><div class="detail-box"><small>Progresso / horas</small><strong>${t.progress}% · ${hours.toFixed(1)}h</strong></div><div class="detail-box"><small>CPM</small><strong>${cpm.critical?'Crítica · ':''}folga ${cpm.slack??0} d</strong></div><div class="detail-box"><small>Custos</small><strong>${money(t.plannedCost)} / ${money(t.actualCost)}</strong></div><div class="detail-box"><small>Responsáveis</small><strong>${esc(t.assignees.map(a=>member(a).name).join(', ')||'Não atribuído')}</strong></div><div class="detail-box"><small>Dependências</small><strong>${esc(links.map(l=>(byId(state.tasks,l.taskId)?.title||l.taskId)+' '+l.type+(l.lag?` ${l.lag>0?'+':''}${l.lag}d`:'' )).join(', ')||'Nenhuma')}</strong></div>${custom}</div>${t.description?`<div class="section-label">Descrição</div><p class="page-sub" style="font-size:10px">${esc(t.description)}</p>`:''}${externalUrl?`<p style="margin-top:8px"><a class="btn sm" href="${esc(externalUrl)}" target="_blank" rel="noopener noreferrer">Abrir referência externa ↗</a></p>`:''}<div class="section-label">Subtarefas</div><div id="subtaskList">${renderSubtasks(t)}</div><div class="comment-form"><input class="input" id="newSubtask" placeholder="Nova subtarefa"><button class="btn" id="addSubtask">Adicionar</button></div><div class="section-label">Comentários</div>${renderComments(t)}<div class="comment-form"><input class="input" id="newComment" placeholder="Escreva uma atualização…"><button class="btn primary" id="addComment">Enviar</button></div><div class="section-label">Arquivos locais</div><div id="attachmentList">${renderAttachments(t)}</div><div class="actions" style="margin-top:8px"><label class="btn">＋ Anexar arquivo<input type="file" id="addAttachment" hidden></label><button class="btn" id="newSketch">✎ Novo rascunho</button></div><p class="muted" style="font-size:8px">Até 1 MB por arquivo; rascunhos criados no app são otimizados automaticamente.</p><div class="section-label">Apontamentos</div>${state.timeEntries.filter(e=>e.taskId===t.id).slice().reverse().map(e=>`<div class="progress-row" style="grid-template-columns:1fr auto"><span>${fmtDateTime(e.startedAt)} · ${esc(member(e.memberId).name)}</span><b>${e.hours.toFixed(2)}h</b></div>`).join('')||'<span class="muted" style="font-size:9px">Nenhuma hora registrada.</span>'}</div></aside>`);
    bindModalClose();$('[data-close-overlay]').onclick=closeOverlay;$('#editFromDetail').onclick=()=>openTaskModal(t);$('#taskTimer').onclick=()=>state.activeTimer?.taskId===t.id?stopTimer():startTimer(t.id);$('#quickComplete').onclick=()=>{closeOverlay();updateTaskStatus(t.id,t.status==='Concluída'?'Em andamento':'Concluída')};$('#taskAssistant').onclick=()=>openTaskAssistant(t);$('#taskLinks').onclick=()=>openLinksModal(t);$('#taskSketch').onclick=$('#newSketch').onclick=()=>openSketchPad(t);$('#addSubtask').onclick=()=>addSubtask(t);$('#newSubtask').onkeydown=e=>{if(e.key==='Enter')addSubtask(t)};$$('[data-subtask]').forEach(x=>x.onchange=()=>{pushUndo('alterar subtarefa');byId(t.subtasks,x.dataset.subtask).done=x.checked;queueSave();openTaskDetail(t.id)});$$('[data-remove-sub]').forEach(x=>x.onclick=()=>{pushUndo('remover subtarefa');t.subtasks=t.subtasks.filter(s=>s.id!==x.dataset.removeSub);queueSave();openTaskDetail(t.id)});$('#addComment').onclick=()=>addComment(t);$('#newComment').onkeydown=e=>{if(e.key==='Enter')addComment(t)};$('#addAttachment').onchange=e=>addAttachment(t,e);$$('[data-attachment]').forEach(x=>x.onclick=()=>downloadAttachment(t,x.dataset.attachment));
  }
  function openTaskAssistant(t){const late=t.status!=='Concluída'&&t.end<today(),links=taskLinks(t),open=(t.subtasks||[]).filter(s=>!s.done),summary=`${t.title} está ${t.status.toLowerCase()}, com ${t.progress}% de avanço${late?', atrasada desde '+fmtDate(t.end):', entrega em '+fmtDate(t.end)}. ${t.assignees.length?'Responsáveis: '+t.assignees.map(id=>member(id).name).join(', ')+'.':'Ainda sem responsável.'} ${links.length?`Possui ${links.length} dependência(s).`:''} ${open.length?`Restam ${open.length} subtarefa(s).`:''}`.replace(/\s+/g,' ').trim(),presets={Engenharia:['Conferir dados de entrada','Validar hipóteses e combinações','Executar revisão independente','Registrar memória de decisão'],Fabricação:['Confirmar materiais e rastreabilidade','Inspecionar dimensões e soldas','Registrar não conformidades','Emitir liberação de qualidade'],Instalação:['Validar plano de içamento','Conferir fixações e estabilidade temporária','Registrar torque e inspeções','Emitir as built e fotos']},suggestions=presets[t.phase]||['Confirmar escopo e responsável','Executar entrega','Realizar revisão','Registrar aprovação'];overlay(modal('Assistente da tarefa',`<div class="notice" style="border-left-color:var(--blue)">${esc(summary)}</div><div class="section-label">Subtarefas sugeridas</div>${suggestions.map(s=>`<label class="subtask"><input type="checkbox" class="aiSuggestion" value="${esc(s)}" checked><span>${esc(s)}</span></label>`).join('')}<p class="muted" style="font-size:9px;margin-top:12px">Resumo e sugestões são gerados localmente com os dados da tarefa; nenhuma informação é enviada para IA externa.</p>`,`<button class="btn" data-close>Fechar</button><button class="btn" id="copyAiSummary">Copiar resumo</button><button class="btn primary" id="applyAiSubs">Adicionar selecionadas</button>`));bindModalClose();$('#copyAiSummary').onclick=()=>navigator.clipboard.writeText(summary).then(()=>toast('Resumo copiado.'));$('#applyAiSubs').onclick=()=>{pushUndo('adicionar subtarefas sugeridas');t.subtasks=t.subtasks||[];$$('.aiSuggestion:checked').forEach(x=>t.subtasks.push({id:uid('sub'),title:x.value,done:false}));activity(`Assistente sugeriu subtarefas para <b>${esc(t.title)}</b>.`,'✦');queueSave();closeOverlay();openTaskDetail(t.id);toast('Subtarefas adicionadas.')}}

  function generateRecurring(t){if(!t.recurrence||t.recurrence==='none')return;const start=nextPeriod(t.start,t.recurrence),end=nextPeriod(t.end,t.recurrence);if(state.tasks.some(x=>x.recurrenceSource===t.id&&x.start===start))return;const copy={...t,id:uid('task'),title:t.title,start,end,baselineStart:start,baselineEnd:end,status:'Backlog',progress:0,subtasks:(t.subtasks||[]).map(s=>({...s,id:uid('sub'),done:false})),comments:[],attachments:[],recurrenceSource:t.id,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.tasks.push(copy);activity(`Próxima ocorrência de <b>${esc(t.title)}</b> foi criada.`,'↻')}
  function updateTaskStatus(id,status){const t=byId(state.tasks,id);if(!t)return;pushUndo('alterar status da tarefa');const old={...t};t.status=status;if(status==='Concluída')t.progress=100;else if(t.progress===100)t.progress=90;t.updatedAt=new Date().toISOString();runAutomations(t,old);if(old.status!=='Concluída'&&status==='Concluída')generateRecurring(t);activity(`Tarefa <b>${esc(t.title)}</b> movida para <b>${esc(status)}</b>.`,'✓');queueSave();renderView();toast(`Status: ${status}`)}
  function startTimer(taskId){if(state.activeTimer&&state.activeTimer.taskId!==taskId)return toast('Pare o cronômetro atual antes de iniciar outro.','error');state.activeTimer={taskId,memberId:state.members[0]?.id||'',startedAt:new Date().toISOString()};queueSave();closeOverlay();shell();toast('Cronômetro iniciado.')}
  function stopTimer(){if(!state.activeTimer)return;const a=state.activeTimer,t=byId(state.tasks,a.taskId),hours=(Date.now()-new Date(a.startedAt))/3600000;state.timeEntries.push({id:uid('time'),taskId:a.taskId,projectId:t?.projectId||'',memberId:a.memberId,startedAt:a.startedAt,endedAt:new Date().toISOString(),hours});state.activeTimer=null;activity(`Apontamento de <b>${hours.toFixed(2)}h</b> registrado em ${esc(t?.title||'tarefa')}.`,'◷');queueSave();closeOverlay();shell();toast(`${hours.toFixed(2)}h registradas.`)}

  function openCommand(){const items=[...NAV.map(n=>({type:'Tela',title:n[2],action:()=>navigate(n[0])})),...state.projects.map(p=>({type:'Projeto',title:p.code+' — '+p.name,action:()=>{selectedProject=p.id;shell();navigate('dashboard')}})),...state.tasks.map(t=>({type:'Tarefa',title:t.title,action:()=>openTaskDetail(t.id)})),...state.docs.map(d=>({type:'Documento',title:d.title,action:()=>{selectedDoc=d.id;selectedProject=d.projectId;shell();navigate('docs')}}))];overlay(`<div class="command" data-close-overlay><div class="command-box" onclick="event.stopPropagation()"><input class="input" id="commandInput" placeholder="Ir para uma tela, projeto, tarefa ou documento…"><div class="command-results" id="commandResults"></div></div></div>`);const render=q=>{$('#commandResults').innerHTML=items.filter(i=>!q||i.title.toLowerCase().includes(q.toLowerCase())).slice(0,30).map((i,n)=>`<div class="command-item" data-command="${n}"><strong>${esc(i.title)}</strong><span>${i.type}</span></div>`).join('');$$('[data-command]').forEach((el,n)=>el.onclick=()=>{const filtered=items.filter(i=>!q||i.title.toLowerCase().includes(q.toLowerCase())).slice(0,30);closeOverlay();filtered[n].action()})};render('');$('#commandInput').oninput=e=>render(e.target.value);$('#commandInput').focus();$('[data-close-overlay]').onclick=closeOverlay}

  async function init(){await loadState();shell();if(localStorage.getItem('pes_cloud_enabled')==='1')resumeCloudSession();else showAuthGate()}
  init().catch(err=>{console.error(err);document.body.innerHTML='<div style="padding:40px;color:white;font-family:Arial"><h1>Não foi possível iniciar o aplicativo.</h1><p>Atualize a página ou restaure o armazenamento do navegador.</p></div>'});
  </script>
